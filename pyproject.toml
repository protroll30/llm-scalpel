[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "causal-patcher"
version = "0.1.0"
description = "Simple activation patching on top of TransformerLens HookedTransformer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "causal-patcher contributors" }]
keywords = ["mechanistic-interpretability", "transformer-lens", "activation-patching", "causal-tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "transformer-lens>=2.0",
  "sae-lens>=6.43.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "neuronpedia>=1.2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
demo = [
  "pandas>=2.0",
  "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["causal_patcher"]

[tool.hatch.build.targets.sdist]
include = ["causal_patcher", "tests", "docs", "notebooks", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Helps Pylance / Pyright resolve `causal_patcher` as a first-party package
[tool.pyright]
include = ["causal_patcher", "discovery", "tests", "scripts"]
extraPaths = ["."]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
